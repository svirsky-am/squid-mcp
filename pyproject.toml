[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-reporter"
version = "0.3.0"
description = "Выгрузка данных Wildberries в SQLite и сводные xlsx-отчёты"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
drive = ["gspread>=6", "google-auth>=2"]
dev = ["pytest>=8", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
