[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-reporter"
version = "0.3.0"
description = "Выгрузка данных Wildberries в SQLite и сводные xlsx-отчёты"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
drive = [
    "google-api-python-client>=2.0.0", 
    "google-auth>=2.0.0", 
    "google-auth-httplib2>=0.1.0"
]
dev = [
    "pytest>=8.0.0", 
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.5.0",
]
